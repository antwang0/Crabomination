[toolchain]
# The latest stable at the Bevy 0.20 upgrade (which needs rustc >= 1.97.1).
# Pinned so the whole workspace builds with one compiler and PERF.md's
# readings name the compiler they were taken on; a bump re-takes the A/B base.
# The engine crates build on 1.94+ too, but a single pin keeps
# `cargo build --workspace` honest.
channel = "1.99.0"
components = ["clippy", "rustfmt"]
