[package]
name = "crabomination_base"
version = "0.1.0"
edition = "2024"

[dependencies]
# `rc`: `CardDefinition::prepare_spell` is an `Arc<CardDefinition>` so the
# inset spell is shared, not deep-cloned, per Prepare cast (PERF `(-265)`);
# an `Arc<T>` (de)serializes exactly as the `Box<T>` it replaced.
serde = { version = "1.0.228", features = ["derive", "rc"] }
# Inline storage for the small per-turn lists on `CardData`. `union` for the
# reason `crabomination/Cargo.toml` gives; `serde` so the fields keep their
# derived (sequence) wire shape.
smallvec = { version = "1.15", features = ["union", "serde"] }
# `textrewrite` only (and `copyvec`'s round-trip test): the CR 612.1 rewrite
# is the one JSON round trip of the definition tree, kept in this crate so
# the engine never instantiates `CardDefinition: Deserialize` (PERF "Serde
# derives" — 482 k of the engine's 4.4 M LLVM-IR lines).
serde_json = "1.0.150"
