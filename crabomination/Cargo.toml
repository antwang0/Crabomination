[package]
name = "crabomination"
version = "0.1.0"
edition = "2024"

[dependencies]
crabomination_base = { path = "../crabomination_base" }
crabomination_catalog = { path = "../crabomination_catalog" }
crabomination_nn = { path = "../crabomination_nn" }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rand = "0.10.2"
# Inline-storage vectors for the hot local accumulators PERF's allocation
# table names: a buffer that never escapes its function can stop allocating
# entirely rather than allocate more cheaply. Already resolved in
# `Cargo.lock` (bevy pulls it), so it costs no download and ~1 s of build.
# `union` is not optional: without it `SmallVecData` is an enum and every
# read pays a discriminant match on top of the spilled check — measured at
# ~40 Ir a call site's owner, enough to turn (-71) from -0.5 % into +0.1 %
# on `--decks fixed`. See the comment at `sa_cards`.
smallvec = { version = "1.15", features = ["union"] }

ctor = "1.0.7"

# Native-only transport deps: raw sockets don't exist on wasm32; the browser
# client uses the WebSocket API via web-sys instead (see crabomination_client).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
socket2 = { version = "0.6.4", features = ["all"] }
# Allocator for the simulator binaries. malloc/free/consolidate plus the
# memcpy they drive were ~16 % of instructions in the callgrind profile, and
# the engine's allocation pattern (many short-lived per-gather Vecs, one
# thread per game worker) is what a thread-caching allocator is for. Native
# only — there is no mimalloc on wasm32, and the browser client doesn't want
# one. The `#[global_allocator]` lives in the binaries: it is a whole-program
# decision and belongs to whoever builds the program.
mimalloc = { version = "0.1.52", optional = true, default-features = false }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }

# rand's OS entropy source needs the JS backend on wasm32 (see
# .cargo/config.toml for the matching getrandom_backend rustflag).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
# On by default: mimalloc is worth +21.9 % on the committed bench and more as
# actors scale (+31 % at 24), for a flat ~1.5-1.7x RSS that is 179 MiB at 24
# actors. See PERF.md. Build with `--no-default-features` to get the system
# allocator back for an A/B. The `#[global_allocator]` itself lives in the
# binaries, so a library consumer only pays the (unused) dependency.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

# `cargo test` builds a *test harness* per `[[bin]]` on top of the normal
# binary, and seven of the nine bins carry no `#[cfg(test)]` block at all — so
# seven of the twenty executables a `cargo test` relinks exist to run zero
# tests. `test = false` drops the harness and keeps the binary.
#
# Measured (PERF.md's recipe: touch `game/effects/mod.rs`, then
# `cargo test -p crabomination -p crabomination_tests --no-run`, three runs):
# **25.21 s -> 21.68 s, -14.0 %**, executables 20 -> 13. It is the link and
# only the link — one of these harnesses starts and finishes in 3.5 ms, so
# there was no meaningful run-time cost to remove.
#
# `audit_stubs` and `replay_view` are left alone — they hold four real tests
# over bin-local helpers (`classify` / `def_has_any_ability`, `narrate`).
[[bin]]
name = "audit_incomplete"
test = false

[[bin]]
name = "bot_ladder"
test = false

[[bin]]
name = "bot_probe"
test = false

[[bin]]
name = "bot_puzzles"
test = false

[[bin]]
name = "deck_duel"
test = false

[[bin]]
name = "dump_cards"
test = false

[[bin]]
name = "recommend_pool"
test = false
