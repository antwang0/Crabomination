[workspace]
resolver = "3"
members = ["crabomination_base", "crabomination_catalog", "crabomination", "crabomination_client", "crabomination_server", "crabomination_tests", "crabomination_nn", "crabomination_ml"]

[profile.dev]
# opt-level = 0 (default) keeps clean compile times short. Dependencies
# stay at opt-level = 3 via [profile.dev.package."*"] so bot/runtime
# loops stay fast despite the unoptimized engine crate.
opt-level = 0
# Drop full DWARF/PDB tables — keep just enough for line numbers in
# panic backtraces. Saves ~30–40 % off Bevy-heavy compile/link time and
# shrinks `target/debug/` substantially. Switch back to `debug = true`
# if you need a full debugger session with locals/structs.
debug = "line-tables-only"
# Faster linker on Windows MSVC: emit one PDB per object instead of a
# single monolithic file, so the linker only rewrites what changed on
# an incremental build. (Linux/macOS already default to "unpacked".)
split-debuginfo = "unpacked"

# The NN forward pass runs inside the bot's simulation loops; at the
# workspace's opt-level 0 a ~130k-parameter net would dwarf the game logic
# around it. The crate is tiny, so opting it up costs seconds of compile.
[profile.dev.package.crabomination_nn]
opt-level = 3

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
# Dependencies are recompiled rarely, so we can afford to drop their
# debuginfo entirely — they don't contribute useful frames to dev
# panics and the saving on Bevy alone is significant.
debug = false

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
# No unwinding in any optimized profile (every one below inherits this).
# Nothing in the tree calls `catch_unwind`, so a panic already ended a run;
# what this removes is the landing-pad and drop-flag code the unwinder never
# ran, and the calls LLVM could not mark `nounwind`. PERF `(-250)`, measured
# on `release-fast` `bot_ladder`: paired `--bench` wall clock **+4.45 % /
# +5.51 %** median over two 16-pair runs, cachegrind Ir -3.47 %, I1 misses
# -5.4 %, binary 144.1 -> 125.2 MB, `--bench` counters identical. Tests are
# untouched — cargo always builds test harnesses with unwinding — and the
# robustness grid reads the exit code, so an aborted `debug_assert!` still
# prints its message and still counts as a failure (rc 134 instead of 101).
panic = "abort"

# Release speed with frame pointers and full DWARF, so perf/samply/flamegraph
# resolve engine frames instead of printing `??`. Benchmarks and profiles run
# here — never on a debug build, where opt-level 0 engine code dwarfs whatever
# is being measured.
[profile.profiling]
inherits = "release"
debug = true
split-debuginfo = "unpacked"

# Iteration profile for the ML/measurement binaries: release's opt-level
# with parallel codegen and no LTO, trading the settings the comments
# above call "marginal" for a measured 4.9x faster rebuild: touching
# crabomination_base and rebuilding bot_ladder + deck_duel takes 2m04s
# here vs 10m02s under `release` (2026-08-08, warm dep caches both
# sides). Build with `cargo build --profile release-fast`; output lands
# in `target/release-fast/`.
#
# Rule: never compare throughput or strength numbers across profiles —
# a baseline measured under `release` is only comparable to candidates
# also measured under `release`.
[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false

# `release-fast` plus debuginfo: what line-level callgrind attribution wants.
# `profiling` inherits `release` (cgu 1 + thin LTO) and so costs a ~24-minute
# rebuild; this one rebuilds in minutes and inlines identically to the
# `release-fast` binaries the A/B rows are measured on, so an attribution
# taken here describes the code those rows move.
[profile.profiling-fast]
inherits = "release-fast"
debug = true
split-debuginfo = "unpacked"

# `profiling-fast` plus thin LTO: the instrument that isolates **cross-crate
# inlining** from `release`'s other change (codegen-units 1). Needed because
# `profiling` cannot be built here — rustc peaks at ~5.9 GB of RSS on the
# engine's single codegen unit and the container's memcg kills it (signal 9,
# and an `#[inline]` on a hot base-crate function makes it *worse*, so the two
# sides of such an A/B are not both buildable). This one is cgu 16, peaks
# around a third of that, and answers the only question `release` adds that
# `release-fast` does not: does LTO already inline the callee, so that an
# `#[inline]` on it is a `release-fast`-only artifact?
#
#   cargo build --profile profiling-lto -p crabomination --bin bot_ladder \
#     --no-default-features
[profile.profiling-lto]
inherits = "profiling-fast"
lto = "thin"

# The same binary with the DWARF *packed into the executable*, for the one
# thing `profiling-fast` cannot do here: per-source-line attribution.
# `unpacked` puts the debug info in `.dwo` files, which neither valgrind nor
# `addr2line` reads, so a line lookup against a `profiling-fast` binary
# returns whatever CU the skeleton happens to point at — wrong function, wrong
# file, confidently. Build this one when a line-level look is wanted (cold, so
# it costs a full rebuild) and keep A/B measurement on `profiling-fast`; the
# two inline identically, only the debug-info packaging differs.
#
#   cargo build --profile profiling-lines -p crabomination --bin bot_ladder \
#     --no-default-features
[profile.profiling-lines]
inherits = "release-fast"
debug = true
split-debuginfo = "off"

# `release-fast` with the arithmetic checks release normally drops. The one
# bug class TODO.md's five syntax filters cannot reach is a silent wrap at
# game 400 k; running the actor path here turns it into a panic with a
# backtrace instead. Not a throughput profile — the checks cost real time, so
# no `--bench` number from here goes anywhere near PERF.md's Baseline.
#
#   cargo build --profile overflow -p crabomination --bin bot_ladder
#   target/overflow/bot_ladder --a gang --b gang --games 400 --threads 3 \
#     --seed <n> --decks all      # fixed + cube + sos, i.e. the widest pool
#
# **Add `-C debug-assertions=yes` and the same run also audits every
# `debug_assert!` in the engine** — the `*_scan` presence-gate audits, the
# `computed_kw` gated-subset guard, and any invariant a later pass writes.
# `debug_assertions` is off in `release-fast`, so the sweep above does not
# reach them, and the suite does not either: a `debug_assert!` needs a *board*
# to fire on, and 18,795 tests carry fewer interesting boards than 60 games of
# `cube`. Costs a separate target dir (the flag re-fingerprints every crate)
# and ~9 min of cold build. Eighty-first pass: 30 cells, five pools x six
# seeds x 120 games/archetype, **34,560 games, no panic, no assertion, no
# overflow, 0 undecided**.
#
#   RUSTFLAGS="-C debug-assertions=yes" CARGO_TARGET_DIR=target-audit \
#     cargo build --profile overflow -p crabomination --bin bot_ladder
#   RUST_MIN_STACK=33554432 target-audit/overflow/bot_ladder --a gang --b gang \
#     --games 120 --threads 3 --seed <n> --decks <pool>
[profile.overflow]
inherits = "release-fast"
overflow-checks = true

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
