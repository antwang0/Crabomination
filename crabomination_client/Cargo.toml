[package]
name = "crabomination_client"
version = "0.1.0"
edition = "2024"

[dependencies]
# Bevy's `default` feature set, spelled out so `wayland` and `audio` can be
# split off behind our own default-on features (see [features] below).
bevy = { version = "0.19.0", default-features = false, features = [
    # `2d` + `3d` + `ui`, minus the `default_platform` they pull in
    "default_app",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "scene",
    "picking",
    # `default_platform` minus `wayland`
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "custom_cursor",
    "sysinfo_plugin",
] }
bevy_mesh = "0.19.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
# The engine, with its own `mimalloc` feature off: the allocator is the
# *program's* call and this program makes it below, in its own dependency
# table, so the choice is visible in one place instead of two.
crabomination = { path = "../crabomination", default-features = false }
# Generating the white name-placeholder PNGs for cards with no Scryfall art
# (see scryfall::ensure_card_images). All three are already in the tree via
# Bevy, so they add no new compilation beyond imageproc itself.
image = "0.25.10"
imageproc = "0.27"
ab_glyph = "0.2.32"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The client IS a simulator now: its bot seat is `MctsBot` at 256 iterations,
# which clones a `GameState` and runs ~58 engine actions per rollout, 256
# rollouts per decision — the many-short-lived-allocations pattern mimalloc
# was adopted for on the engine binaries. Measured on `bot_ladder --a
# mcts-dflt` (release-fast, one thread): 383 -> 227 µs/rollout, **-41 %**.
# Native only (there is no mimalloc on wasm32) and behind a default-on
# feature, so the A/B that produced that number stays runnable:
# `--no-default-features --features wayland,audio,gamepad`.
#
# Worth nothing on a `dev` build — 12,556 (system) vs 13,259 (mimalloc)
# µs/rollout there is noise, because at opt-level 0 the engine's own
# instruction count dwarfs the allocator. It pays only on top of
# `--profile play` / `--release`.
mimalloc = { version = "0.1.52", default-features = false, optional = true }
# Blocking HTTP (card prefetch) and OS config-dir discovery are native-only;
# the browser build loads card art over HTTP via the AssetServer and stores
# config in localStorage.
ureq = "3.3"
dirs = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent",
    "Window", "Storage", "Location",
] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["wayland", "audio", "gamepad", "mimalloc"]

# The bot's allocator (see the dependency's comment). On by default; the
# switch exists so the measurement can be repeated rather than believed.
mimalloc = ["dep:mimalloc"]

# The pkg-config-backed platform bits, split out so a host that lacks the
# system libraries can still type-check the client with
# `--no-default-features`: without them `wayland-sys` / `alsa-sys` /
# `libudev-sys` panic in their build scripts before any of our code is
# compiled. All three are on by default — keep them on for a real build.
wayland = ["bevy/wayland"]
audio = ["bevy/audio"]
gamepad = ["bevy/bevy_gilrs"]

# Bevy's dynamic-linking dev accelerator — OPT-IN ONLY.
#
# It links std + a `bevy_dylib` dynamically, which speeds up the final
# link on iterative *debug* builds, but it must NOT be on for `--release`:
# it's incompatible with this workspace's `lto = "thin"` (rust-lld then
# fails with "undefined symbol" for dynamic-std statics), and a shipped
# release binary would have to carry the std/bevy dylibs alongside it.
#
# Enable it for fast local runs via `cargo dev` (alias in
# .cargo/config.toml) or `cargo run -p crabomination_client --features
# dynamic_linking`. Plain `cargo run`/`build`/`--release` stay statically
# linked.
dynamic_linking = ["bevy/dynamic_linking"]
